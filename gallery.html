<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>NicyFoods · Admin · Gallery</title>

    <script src="https://cdn.tailwindcss.com"></script>
    <script src="js/tailwind-config.js"></script>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Rozha+One&family=Poppins:ital,wght@0,300;0,400;0,500;0,600;0,700;0,800;1,400&display=swap" rel="stylesheet" />

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />

    <link rel="stylesheet" href="css/admin-styles.css" />
</head>
<body data-page="gallery">

    <div id="sidebar-container"></div>

    <div id="main">
        <div style="display:flex; align-items:center; gap:1rem; margin-bottom:1.8rem; flex-wrap:wrap;" id="topbar-container"></div>

        <div class="flex flex-wrap justify-between items-center gap-3 mb-4">
            <h2 class="font-display text-xl text-jaggery"><i class="fas fa-images text-kumkum"></i> Manage Gallery</h2>
            <button class="btn-primary" onclick="openGalleryModal()"><i class="fas fa-plus"></i> Add Image</button>
        </div>
        <div class="table-wrap">
            <table>
                <thead><tr><th style="width:70px;">Image</th><th>Title</th><th>Alt Text</th><th>Tile Size</th><th>Order</th><th>Status</th><th style="min-width:130px;">Actions</th></tr></thead>
                <tbody id="galleryTableBody"></tbody>
            </table>
        </div>
    </div>

    <!-- ===== GALLERY MODAL ===== -->
    <div id="galleryModal" class="modal-overlay">
        <div class="modal-box">
            <div class="modal-header">
                <h2 id="galleryModalTitle"><i class="fas fa-images"></i> Add Image</h2>
                <button class="modal-close" onclick="closeModal('galleryModal')"><i class="fas fa-times"></i></button>
            </div>
            <form id="galleryForm">
                <input type="hidden" id="galleryId" />
                <div class="form-group">
                    <label class="form-label"><i class="fas fa-image"></i> Gallery Image</label>
                    <div class="image-upload-box" id="galleryImageUploadBox">
                        <img id="gImagePreview" class="image-preview" alt="Preview" />
                        <div class="image-upload-hint">
                            <i class="fas fa-cloud-upload-alt"></i> <strong>Click to upload</strong> or drag a photo<br>
                            <span style="font-size:0.65rem;">JPG, PNG, WEBP · Max 5MB</span>
                        </div>
                        <input type="file" id="gImageFile" accept="image/png, image/jpeg, image/webp, image/gif" />
                    </div>
                    <p id="galleryImageUploadStatus" class="image-upload-status"></p>
                    <p class="form-hint"><i class="fas fa-info-circle"></i> Required only when adding a new image. Leave empty on edit to keep the existing photo.</p>
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label class="form-label"><i class="fas fa-tag"></i> Title (optional)</label>
                        <div class="input-icon-wrap">
                            <i class="fas fa-heading"></i>
                            <input id="gTitle" placeholder="e.g. Murmura Laddu" />
                        </div>
                    </div>
                    <div class="form-group">
                        <label class="form-label"><i class="fas fa-sort-numeric-down"></i> Display Order</label>
                        <div class="input-icon-wrap">
                            <i class="fas fa-arrow-down-wide-short"></i>
                            <input id="gOrder" type="number" step="1" min="0" value="0" />
                        </div>
                    </div>
                </div>
                <div class="form-group">
                    <label class="form-label"><i class="fas fa-universal-access"></i> Alt Text</label>
                    <div class="input-icon-wrap">
                        <i class="fas fa-eye"></i>
                        <input id="gAltText" required placeholder="e.g. Murmura Laddu close-up" />
                    </div>
                </div>
                <div class="form-group">
                    <label class="form-label"><i class="fas fa-expand"></i> Tile Size</label>
                    <select id="gSize">
                        <option value="normal">Normal</option>
                        <option value="large">Large (tall tile)</option>
                    </select>
                </div>
                <div class="form-group">
                    <label class="form-label"><i class="fas fa-toggle-on"></i> Active?</label>
                    <div class="toggle-wrap">
                        <span class="toggle-label" id="galleryActiveLabel">Yes, visible on site</span>
                        <div class="toggle-switch active" id="galleryActiveToggle" onclick="toggleGalleryActive()">
                            <input type="hidden" id="gIsActive" value="true" />
                            <div class="toggle-knob"></div>
                        </div>
                    </div>
                </div>
                <div style="display:flex; justify-content:flex-end; gap:0.8rem; padding-top:1rem; border-top:1px solid rgba(92,58,37,0.06); margin-top:0.5rem;">
                    <button type="button" class="text-slate-500 hover:text-slate-700" onclick="closeModal('galleryModal')" style="font-weight:500; background:transparent; border:none; cursor:pointer; padding:0.4rem 0.8rem;">Cancel</button>
                    <button type="submit" id="gallerySaveBtn" class="btn-primary"><i class="fas fa-save"></i> Save Image</button>
                </div>
            </form>
        </div>
    </div>

    <div id="toast" class="toast"><i class="fas fa-check-circle"></i> <span id="toastMsg">Success</span></div>

    <script src="js/auth-client.js"></script>
    <script src="js/admin-common.js"></script>
    <script src="js/sidebar.js"></script>
    <script src="js/gallery-admin.js"></script>
</body>
</html>
