<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Cancellation Policy | NicyFoods</title>

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        cream: '#FFFFFF',
                        jaggery: '#5C3A25',
                        ink: '#3A2417',
                        turmeric: '#F5A623',
                        marigold: '#FFC72C',
                        kumkum: '#D7263D',
                        herbal: '#5F7A4F',
                    },
                    fontFamily: {
                        display: ['"Rozha One"', 'serif'],
                        body: ['Poppins', 'sans-serif'],
                    },
                },
            },
        };
    </script>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Rozha+One&family=Poppins:ital,wght@0,300;0,400;0,500;0,600;0,700;0,800;1,400&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="css/style.css" />

    <style>
        body { font-family: 'Poppins', sans-serif; background: #FFFFFF; color: #3A2417; }
        .policy-hero {
            background: linear-gradient(120deg, #FFF8EC 0%, #FFECC7 50%, #FFDCAE 100%);
        }
        #policy-content p {
            margin-bottom: 1.1rem;
            line-height: 1.85;
            color: #3A2417;
        }
        #policy-content { font-size: 1.02rem; }
    </style>
</head>
<body data-policy-field="cancellationPolicy">
    <div id="navbar-placeholder"></div>

    <section class="policy-hero pt-32 pb-10 px-4 sm:px-6">
        <div class="max-w-4xl mx-auto text-center">
            <span class="inline-flex items-center gap-2 text-xs sm:text-sm font-semibold tracking-widest uppercase text-[#D7263D] mb-3">
                <i class="fas fa-ban"></i> NicyFoods
            </span>
            <h1 class="text-3xl sm:text-4xl md:text-5xl" style="font-family:'Rozha One', serif; color:#5C3A25;">Cancellation Policy</h1>
        </div>
    </section>

    <main class="max-w-6xl w-full mx-auto px-4 sm:px-8 py-12 sm:py-16">
        <div id="policy-content" data-fallback="Orders can be cancelled free of charge as long as they have not yet been packed/dispatched. Once an order has been shipped, it cannot be cancelled, since our products are perishable food items made fresh to order. To request a cancellation, please contact us as soon as possible at nicyfoods5@gmail.com or +91 8263001410 with your order number.">
            <p>Loading…</p>
        </div>
        <p class="mt-10 text-sm text-[#5C3A25]/70">
            Questions about this policy? <a href="contact.html" class="text-[#D7263D] font-semibold hover:underline">Contact us</a> — we're happy to help.
        </p>
    </main>

    <div id="footer-placeholder"></div>

    <script src="js/navbar.js"></script>
    <script src="js/footer.js"></script>
    <script src="js/policy-page.js"></script>
</body>
</html>
