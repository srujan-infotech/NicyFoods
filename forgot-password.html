<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Forgot Password | NicyFoods</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            cream:    '#FBF1E2',
            jaggery:  '#5C3A25',
            ink:      '#3A2417',
            turmeric: '#E8A33D',
            marigold: '#F2C14E',
            kumkum:   '#A63A2E',
            herbal:   '#5F7A4F',
          },
          fontFamily: {
            display: ['"Rozha One"', 'serif'],
            body: ['Poppins', 'sans-serif'],
          },
        },
      },
    };
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Rozha+One&family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    :root{
      --cream:#FBF1E2; --jaggery:#5C3A25; --ink:#3A2417;
      --turmeric:#E8A33D; --marigold:#F2C14E; --kumkum:#A63A2E; --herbal:#5F7A4F;
    }
    *{ box-sizing:border-box; }
    body {
      font-family: 'Poppins', sans-serif;
      background: var(--cream);
      min-height: 100vh;
      display: flex; align-items: center; justify-content: center;
      padding: 1rem;
      overflow-x: hidden;
      position: relative;
    }
    h1, .font-display{ font-family:'Rozha One', serif; letter-spacing:.01em; }

    .bg-kolam{
      position: fixed; pointer-events: none; opacity: .18; z-index: 0;
      animation: kolamSpin 90s linear infinite;
    }
    @keyframes kolamSpin{ to{ transform: rotate(360deg); } }
    .bg-kolam.rev{ animation-name: kolamSpinRev; opacity:.14; }
    @keyframes kolamSpinRev{ to{ transform: rotate(-360deg); } }

    .login-card{
      position: relative; z-index: 10;
      background: #fff;
      border-radius: 1.75rem;
      box-shadow: 0 24px 60px -20px rgba(58,36,23,.35), inset 0 0 0 1px rgba(92,58,37,.05);
      max-width: 420px; width: 100%;
      padding: 2.5rem 2.25rem;
      animation: cardIn .7s cubic-bezier(.16,.84,.44,1) both;
    }
    @keyframes cardIn{ from{ opacity:0; transform: translateY(24px) scale(.98); } to{ opacity:1; transform: translateY(0) scale(1); } }

    .logo-ring{
      width: 76px; height: 76px; border-radius: 9999px; margin: 0 auto .9rem;
      padding: 3px;
      background: conic-gradient(from 0deg, var(--turmeric), var(--marigold), var(--kumkum), var(--turmeric));
      animation: ringSpin 14s linear infinite;
    }
    @keyframes ringSpin{ to{ transform: rotate(360deg); } }
    .logo-ring img{
      width: 100%; height: 100%; border-radius: 9999px; object-fit: cover;
      border: 3px solid #fff; display: block;
    }

    .field-wrap{ position: relative; }
    .field-wrap input{
      box-sizing: border-box !important;
      border: 1.5px solid rgba(92,58,37,0.15) !important;
      border-radius: 0.8rem !important;
      padding: 0.75rem 0.9rem 0.75rem 2.7rem !important;
      width: 100% !important;
      font-family: inherit !important;
      transition: border-color .2s ease, box-shadow .2s ease, transform .15s ease;
    }
    .field-wrap input:focus{
      outline: none !important;
      border-color: var(--kumkum) !important;
      box-shadow: 0 0 0 3px rgba(166,58,46,.12);
      transform: translateY(-1px);
    }
    .field-icon{
      position: absolute; left: 14px; top: 50%; transform: translateY(-50%);
      width: 18px; height: 18px; color: var(--jaggery); opacity: .45;
      pointer-events: none; transition: opacity .2s ease, color .2s ease;
      z-index: 2;
    }
    .field-wrap input:focus ~ .field-icon{ opacity: .9; color: var(--kumkum); }

    .btn-primary {
      position: relative; overflow: hidden;
      background: linear-gradient(90deg, var(--turmeric), var(--kumkum));
      color: white; font-weight: 600;
      padding: 0.85rem 1.5rem; border-radius: 0.8rem; border: none; cursor: pointer;
      transition: transform 0.2s ease, box-shadow 0.2s ease, opacity .2s ease;
      width: 100%;
    }
    .btn-primary::before{
      content:''; position:absolute; top:0; left:-60%; width:40%; height:100%;
      background:linear-gradient(115deg, transparent, rgba(255,255,255,.5), transparent);
      transform:skewX(-20deg); transition:left .8s ease;
    }
    .btn-primary:hover::before{ left:130%; }
    .btn-primary:hover { transform: translateY(-2px); box-shadow: 0 10px 22px -8px rgba(166,58,46,0.45); }
    .btn-primary:active { transform: scale(0.97); }
    .btn-primary:disabled { opacity: 0.6; cursor: not-allowed; }

    .error-msg { color: #dc2626; font-size: 0.9rem; text-align: center; margin-top: 0.75rem; display: none; }
    .success-msg { color: #16a34a; font-size: 0.9rem; text-align: center; margin-top: 0.75rem; display: none; background: #f0fdf4; border: 1px solid #bbf7d0; padding: 0.75rem 1rem; border-radius: 0.6rem; }
    .loader { border: 2px solid rgba(255,255,255,.4); border-top: 2px solid #fff; border-radius: 50%; width: 16px; height: 16px; animation: spin 0.8s linear infinite; display: inline-block; margin-right: 0.5rem; vertical-align: -2px; }
    @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

    @media (prefers-reduced-motion: reduce){
      *{ animation: none !important; transition: none !important; }
    }
  </style>
</head>
<body>

  <svg class="bg-kolam" style="top:-80px; left:-80px; width:280px; height:280px;" viewBox="0 0 200 200" fill="none">
    <g stroke="#A63A2E" stroke-width="1.2"><circle cx="100" cy="100" r="90"/><circle cx="100" cy="100" r="65"/></g>
  </svg>
  <svg class="bg-kolam rev" style="bottom:-90px; right:-90px; width:300px; height:300px;" viewBox="0 0 200 200" fill="none">
    <g stroke="#E8A33D" stroke-width="1.2"><circle cx="100" cy="100" r="90"/><circle cx="100" cy="100" r="70"/></g>
  </svg>

  <div class="login-card">
    <div class="text-center mb-6">
      <div class="logo-ring">
        <img src="assets/images/logo-nicy.png" alt="NicyFoods" />
      </div>
      <h1 class="font-display text-2xl md:text-3xl" style="color:var(--jaggery);">Forgot Password?</h1>
      <p class="text-sm text-slate-500 mt-1">Enter your email and we'll send you a reset link</p>
    </div>

    <form id="forgotForm">
      <div class="mb-5">
        <label class="block text-sm font-medium text-slate-700 mb-1.5">Email</label>
        <div class="field-wrap">
          <input type="email" id="fpEmail" placeholder="your@email.com" required />
          <svg class="field-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <rect x="2" y="4" width="20" height="16" rx="2"/><path d="M2 6l10 7 10-7"/>
          </svg>
        </div>
      </div>
      <button type="submit" id="fpBtn" class="btn-primary">
        <span id="fpBtnText">Send Reset Link</span>
      </button>
      <div id="fpError" class="error-msg"></div>
      <div id="fpSuccess" class="success-msg"></div>
    </form>

    <p class="text-center text-sm text-slate-500 mt-6">
      Remembered your password? <a href="login.html" class="font-medium hover:underline" style="color:var(--kumkum);">Back to sign in</a>
    </p>
  </div>

  <script>
    document.getElementById('forgotForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const email = document.getElementById('fpEmail').value.trim();
      const btn = document.getElementById('fpBtn');
      const btnText = document.getElementById('fpBtnText');
      const errorEl = document.getElementById('fpError');
      const successEl = document.getElementById('fpSuccess');

      errorEl.style.display = 'none';
      successEl.style.display = 'none';
      btn.disabled = true;
      btnText.innerHTML = '<span class="loader"></span> Sending...';

      try {
        const res = await fetch('https://nicyfoods.com/api/auth/forgot-password', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email }),
        });
        const data = await res.json();

        if (!res.ok) {
          errorEl.textContent = data.message || 'Something went wrong. Please try again.';
          errorEl.style.display = 'block';
          btn.disabled = false;
          btnText.textContent = 'Send Reset Link';
          return;
        }

        successEl.textContent = data.message || 'If an account exists for that email, a reset link has been sent.';
        successEl.style.display = 'block';
        btnText.textContent = 'Reset Link Sent';
      } catch (err) {
        console.error('Forgot password error:', err);
        errorEl.textContent = 'Network error. Please check your connection and try again.';
        errorEl.style.display = 'block';
        btn.disabled = false;
        btnText.textContent = 'Send Reset Link';
      }
    });
  </script>
</body>
</html>
