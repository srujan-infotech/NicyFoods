<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Reset Password | NicyFoods</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            cream:    '#FBF1E2',
            jaggery:  '#5C3A25',
            ink:      '#3A2417',
            turmeric: '#E8A33D',
            marigold: '#F2C14E',
            kumkum:   '#A63A2E',
            herbal:   '#5F7A4F',
          },
          fontFamily: {
            display: ['"Rozha One"', 'serif'],
            body: ['Poppins', 'sans-serif'],
          },
        },
      },
    };
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Rozha+One&family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    :root{
      --cream:#FBF1E2; --jaggery:#5C3A25; --ink:#3A2417;
      --turmeric:#E8A33D; --marigold:#F2C14E; --kumkum:#A63A2E; --herbal:#5F7A4F;
    }
    *{ box-sizing:border-box; }
    body {
      font-family: 'Poppins', sans-serif;
      background: var(--cream);
      min-height: 100vh;
      display: flex; align-items: center; justify-content: center;
      padding: 1rem;
      overflow-x: hidden;
      position: relative;
    }
    h1, .font-display{ font-family:'Rozha One', serif; letter-spacing:.01em; }

    .bg-kolam{
      position: fixed; pointer-events: none; opacity: .18; z-index: 0;
      animation: kolamSpin 90s linear infinite;
    }
    @keyframes kolamSpin{ to{ transform: rotate(360deg); } }
    .bg-kolam.rev{ animation-name: kolamSpinRev; opacity:.14; }
    @keyframes kolamSpinRev{ to{ transform: rotate(-360deg); } }

    .login-card{
      position: relative; z-index: 10;
      background: #fff;
      border-radius: 1.75rem;
      box-shadow: 0 24px 60px -20px rgba(58,36,23,.35), inset 0 0 0 1px rgba(92,58,37,.05);
      max-width: 420px; width: 100%;
      padding: 2.5rem 2.25rem;
      animation: cardIn .7s cubic-bezier(.16,.84,.44,1) both;
    }
    @keyframes cardIn{ from{ opacity:0; transform: translateY(24px) scale(.98); } to{ opacity:1; transform: translateY(0) scale(1); } }

    .logo-ring{
      width: 76px; height: 76px; border-radius: 9999px; margin: 0 auto .9rem;
      padding: 3px;
      background: conic-gradient(from 0deg, var(--turmeric), var(--marigold), var(--kumkum), var(--turmeric));
      animation: ringSpin 14s linear infinite;
    }
    @keyframes ringSpin{ to{ transform: rotate(360deg); } }
    .logo-ring img{
      width: 100%; height: 100%; border-radius: 9999px; object-fit: cover;
      border: 3px solid #fff; display: block;
    }

    .field-wrap{ position: relative; }
    .field-wrap input{
      box-sizing: border-box !important;
      border: 1.5px solid rgba(92,58,37,0.15) !important;
      border-radius: 0.8rem !important;
      padding: 0.75rem 0.9rem 0.75rem 2.7rem !important;
      width: 100% !important;
      font-family: inherit !important;
      transition: border-color .2s ease, box-shadow .2s ease, transform .15s ease;
    }
    .field-wrap input:focus{
      outline: none !important;
      border-color: var(--kumkum) !important;
      box-shadow: 0 0 0 3px rgba(166,58,46,.12);
      transform: translateY(-1px);
    }
    .field-icon{
      position: absolute; left: 14px; top: 50%; transform: translateY(-50%);
      width: 18px; height: 18px; color: var(--jaggery); opacity: .45;
      pointer-events: none; transition: opacity .2s ease, color .2s ease;
      z-index: 2;
    }
    .field-wrap input:focus ~ .field-icon{ opacity: .9; color: var(--kumkum); }
    .field-wrap input.pwd-input{ padding-right: 2.6rem !important; }
    .toggle-password{
      position: absolute; right: 12px; top: 50%; transform: translateY(-50%);
      width: 20px; height: 20px; padding: 0; border: none; background: transparent;
      color: var(--jaggery); opacity: .5; cursor: pointer; z-index: 3;
      display: flex; align-items: center; justify-content: center;
      transition: opacity .2s ease, color .2s ease;
    }
    .toggle-password:hover{ opacity: .9; color: var(--kumkum); }
    .toggle-password svg{ width: 100%; height: 100%; }

    .btn-primary {
      position: relative; overflow: hidden;
      background: linear-gradient(90deg, var(--turmeric), var(--kumkum));
      color: white; font-weight: 600;
      padding: 0.85rem 1.5rem; border-radius: 0.8rem; border: none; cursor: pointer;
      transition: transform 0.2s ease, box-shadow 0.2s ease, opacity .2s ease;
      width: 100%;
    }
    .btn-primary::before{
      content:''; position:absolute; top:0; left:-60%; width:40%; height:100%;
      background:linear-gradient(115deg, transparent, rgba(255,255,255,.5), transparent);
      transform:skewX(-20deg); transition:left .8s ease;
    }
    .btn-primary:hover::before{ left:130%; }
    .btn-primary:hover { transform: translateY(-2px); box-shadow: 0 10px 22px -8px rgba(166,58,46,0.45); }
    .btn-primary:active { transform: scale(0.97); }
    .btn-primary:disabled { opacity: 0.6; cursor: not-allowed; }

    .error-msg { color: #dc2626; font-size: 0.9rem; text-align: center; margin-top: 0.75rem; display: none; }
    .success-msg { color: #16a34a; font-size: 0.9rem; text-align: center; margin-top: 0.75rem; display: none; background: #f0fdf4; border: 1px solid #bbf7d0; padding: 0.75rem 1rem; border-radius: 0.6rem; }
    .loader { border: 2px solid rgba(255,255,255,.4); border-top: 2px solid #fff; border-radius: 50%; width: 16px; height: 16px; animation: spin 0.8s linear infinite; display: inline-block; margin-right: 0.5rem; vertical-align: -2px; }
    @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    .hint { font-size: 0.78rem; color: #94826f; margin-top: 0.4rem; }

    @media (prefers-reduced-motion: reduce){
      *{ animation: none !important; transition: none !important; }
    }
  </style>
</head>
<body>

  <svg class="bg-kolam" style="top:-80px; left:-80px; width:280px; height:280px;" viewBox="0 0 200 200" fill="none">
    <g stroke="#A63A2E" stroke-width="1.2"><circle cx="100" cy="100" r="90"/><circle cx="100" cy="100" r="65"/></g>
  </svg>
  <svg class="bg-kolam rev" style="bottom:-90px; right:-90px; width:300px; height:300px;" viewBox="0 0 200 200" fill="none">
    <g stroke="#E8A33D" stroke-width="1.2"><circle cx="100" cy="100" r="90"/><circle cx="100" cy="100" r="70"/></g>
  </svg>

  <div class="login-card">
    <div class="text-center mb-6">
      <div class="logo-ring">
        <img src="assets/images/logo-nicy.png" alt="NicyFoods" />
      </div>
      <h1 class="font-display text-2xl md:text-3xl" style="color:var(--jaggery);">Set a New Password</h1>
      <p class="text-sm text-slate-500 mt-1">Choose a new password for your account</p>
    </div>

    <form id="resetForm">
      <div class="mb-4">
        <label class="block text-sm font-medium text-slate-700 mb-1.5">New Password</label>
        <div class="field-wrap">
          <input type="password" id="rpPassword" class="pwd-input" placeholder="••••••••" required minlength="6" />
          <svg class="field-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <rect x="4" y="10" width="16" height="10" rx="2"/><path d="M8 10V7a4 4 0 0 1 8 0v3"/>
          </svg>
          <button type="button" class="toggle-password" id="toggleRpPassword" aria-label="Show password" tabindex="-1">
            <svg class="eye-open" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7-11-7-11-7z"/><circle cx="12" cy="12" r="3"/>
            </svg>
            <svg class="eye-closed" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display:none;">
              <path d="M17.94 17.94A10.94 10.94 0 0 1 12 19c-7 0-11-7-11-7a21.6 21.6 0 0 1 5.06-6.06M9.9 4.24A10.94 10.94 0 0 1 12 5c7 0 11 7 11 7a21.6 21.6 0 0 1-2.16 3.19M14.12 14.12a3 3 0 1 1-4.24-4.24"/><path d="M1 1l22 22"/>
            </svg>
          </button>
        </div>
        <p class="hint">At least 6 characters.</p>
      </div>
      <div class="mb-5">
        <label class="block text-sm font-medium text-slate-700 mb-1.5">Confirm Password</label>
        <div class="field-wrap">
          <input type="password" id="rpPassword2" class="pwd-input" placeholder="••••••••" required minlength="6" />
          <svg class="field-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <rect x="4" y="10" width="16" height="10" rx="2"/><path d="M8 10V7a4 4 0 0 1 8 0v3"/>
          </svg>
        </div>
      </div>
      <button type="submit" id="rpBtn" class="btn-primary">
        <span id="rpBtnText">Reset Password</span>
      </button>
      <div id="rpError" class="error-msg"></div>
      <div id="rpSuccess" class="success-msg"></div>
    </form>

    <p class="text-center text-sm text-slate-500 mt-6">
      <a href="login.html" class="font-medium hover:underline" style="color:var(--kumkum);">Back to sign in</a>
    </p>
  </div>

  <script>
    function initPasswordToggle(btnId, inputId){
      const btn = document.getElementById(btnId);
      const input = document.getElementById(inputId);
      if(!btn || !input) return;
      const openIcon = btn.querySelector(".eye-open");
      const closedIcon = btn.querySelector(".eye-closed");
      btn.addEventListener("click", () => {
        const show = input.type === "password";
        input.type = show ? "text" : "password";
        openIcon.style.display = show ? "none" : "block";
        closedIcon.style.display = show ? "block" : "none";
        btn.setAttribute("aria-label", show ? "Hide password" : "Show password");
      });
    }
    initPasswordToggle("toggleRpPassword", "rpPassword");

    const params = new URLSearchParams(window.location.search);
    const resetToken = params.get('token');

    if (!resetToken) {
      document.getElementById('rpError').textContent = 'This reset link is missing its token. Please request a new one from the Forgot Password page.';
      document.getElementById('rpError').style.display = 'block';
      document.getElementById('rpBtn').disabled = true;
    }

    document.getElementById('resetForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const password = document.getElementById('rpPassword').value;
      const password2 = document.getElementById('rpPassword2').value;
      const btn = document.getElementById('rpBtn');
      const btnText = document.getElementById('rpBtnText');
      const errorEl = document.getElementById('rpError');
      const successEl = document.getElementById('rpSuccess');

      errorEl.style.display = 'none';
      successEl.style.display = 'none';

      if (password !== password2) {
        errorEl.textContent = 'Passwords do not match.';
        errorEl.style.display = 'block';
        return;
      }
      if (password.length < 6) {
        errorEl.textContent = 'Password must be at least 6 characters.';
        errorEl.style.display = 'block';
        return;
      }

      btn.disabled = true;
      btnText.innerHTML = '<span class="loader"></span> Resetting...';

      try {
        const res = await fetch(`https://nicyfoods.com/api/auth/reset-password/${encodeURIComponent(resetToken)}`, {
          method: 'PUT',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ password }),
        });
        const data = await res.json();

        if (!res.ok) {
          errorEl.textContent = data.message || 'Could not reset password. The link may have expired.';
          errorEl.style.display = 'block';
          btn.disabled = false;
          btnText.textContent = 'Reset Password';
          return;
        }

        successEl.textContent = data.message || 'Password reset! Redirecting to sign in...';
        successEl.style.display = 'block';
        btnText.textContent = 'Password Reset';
        setTimeout(() => { window.location.href = 'login.html'; }, 1800);
      } catch (err) {
        console.error('Reset password error:', err);
        errorEl.textContent = 'Network error. Please check your connection and try again.';
        errorEl.style.display = 'block';
        btn.disabled = false;
        btnText.textContent = 'Reset Password';
      }
    });
  </script>
</body>
</html>
